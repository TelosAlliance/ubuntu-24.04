stages:
  - build
  - push
  - mirror

variables:
  # Kaniko needs this variable to push to the GitLab registry reliably
  DOCKER_CONFIG: /kaniko/.docker
  IMAGE_NAME: ${DH_ORG_NAME}/${DH_PROJECT_NAME}

# --- STAGE 1: PARALLEL BUILDS ---
# This job runs 3 times automatically with different variables
build_multi_arch:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [""]
  parallel:
    matrix:
      - PLATFORM: linux/amd64
        ARCH_TAG: amd64
      - PLATFORM: linux/arm64
        ARCH_TAG: arm64
      - PLATFORM: linux/arm/v7
        ARCH_TAG: armv7
  before_script:
    # Authenticate Kaniko with GitLab Registry
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    - echo "Building for ${PLATFORM}..."
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --customPlatform "${PLATFORM}"
      --destination "${CI_REGISTRY_IMAGE}:build-${CI_COMMIT_SHORT_SHA}-${ARCH_TAG}"
      --cache=true
  only:
    - main
    - master
    - tags

# --- STAGE 2: MERGE & PUSH TO DOCKERHUB ---
push_manifest:
  stage: push
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - docker info
    # Login to Docker Hub (Destination)
    - echo "${DH_USER_TOKEN}" | docker login -u "${DH_USER_NAME}" --password-stdin
    # Login to GitLab Registry (Source)
    - echo "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
  script:
    - export DATE_TAG=$(date +%Y-%m-%d)
    - echo "Merging multi-arch images into manifest..."
    
    # We use buildx imagetools to merge the 3 GitLab images into 1 DockerHub manifest
    - |
      docker buildx imagetools create \
        --tag ${IMAGE_NAME}:${DATE_TAG} \
        --tag ${IMAGE_NAME}:latest \
        ${CI_REGISTRY_IMAGE}:build-${CI_COMMIT_SHORT_SHA}-amd64 \
        ${CI_REGISTRY_IMAGE}:build-${CI_COMMIT_SHORT_SHA}-arm64 \
        ${CI_REGISTRY_IMAGE}:build-${CI_COMMIT_SHORT_SHA}-armv7

    - echo "Successfully pushed multi-arch manifest to ${IMAGE_NAME}:latest"
  after_script:
    - docker logout
    - docker logout "${CI_REGISTRY}"
  only:
    - main
    - master
    - tags

# --- STAGE 3: MIRROR (Unchanged) ---
mirror_github:
  stage: mirror
  image: alpine:latest
  before_script:
    - apk add --no-cache git openssh-client
    - eval $(ssh-agent -s)
    - echo "${GITHUB_SSH_PRIVATE_KEY}" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan github.com >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - git config --global user.email "${GITLAB_USER_EMAIL}"
    - git config --global user.name "${GITLAB_USER_NAME}"
  script:
    - echo "Mirroring to GitHub..."
    - git clone --mirror ${CI_REPOSITORY_URL} repo-mirror
    - cd repo-mirror
    # Uncomment these when ready
    #- git remote add github ${GITHUB_REPO_URL}
    #- git push --mirror github
  only:
    - main
    - master
    - tags