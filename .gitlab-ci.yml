stages:
  - build
  - push
  - mirror

variables:
  # Common variables
  IMAGE_NAME: ${DH_ORG_NAME}/${DH_PROJECT_NAME}

# --- STAGE 1: PARALLEL BUILDS (Shell Runner) ---
build_multi_arch:
  stage: build
  resource_group: build_concurrency_limit
  timeout: 4h
  parallel:
    matrix:
      - PLATFORM: linux/amd64
        ARCH_TAG: amd64
      - PLATFORM: linux/arm64
        ARCH_TAG: arm64
  before_script:
    # 1. Login to GitLab Registry (Intermediate Storage)
    - echo "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
    
    # 2. Install QEMU emulators (Safe to run multiple times, it just updates existing)
    # This allows the shell runner to execute ARM instructions
    - docker run --privileged --rm tonistiigi/binfmt --install all
    
    # 3. Create a unique ephemeral builder for THIS job to avoid conflicts with parallel jobs
    - docker buildx create --use --name "builder-${CI_JOB_ID}" --driver docker-container --driver-opt image=moby/buildkit:master
    - docker buildx inspect --bootstrap

  script:
    - echo "Building for ${PLATFORM}..."
    - |
      docker buildx build \
        --platform "${PLATFORM}" \
        --tag "${CI_REGISTRY_IMAGE}:build-${CI_COMMIT_SHORT_SHA}-${ARCH_TAG}" \
        --push \
        .

  after_script:
    # Clean up the specific builder used for this job
    - docker buildx rm "builder-${CI_JOB_ID}" || true
    - docker logout "${CI_REGISTRY}"
    
  only:
    - main
    - master
    - tags
  tags:
    - linuxdev-shell

# --- STAGE 2: MERGE & PUSH TO DOCKERHUB ---
push_manifest:
  stage: push
  # No image/services needed if using shell runner here too
  before_script:
    - docker info
    - echo "${DH_USER_TOKEN}" | docker login -u "${DH_USER_NAME}" --password-stdin
    - echo "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
  script:
    - export DATE_TAG=$(date +%Y-%m-%d)
    - echo "Merging multi-arch images into manifest..."
    
    # 1. Create the manifest list on Docker Hub
    - |
      docker buildx imagetools create \
        --tag ${IMAGE_NAME}:${DATE_TAG} \
        --tag ${IMAGE_NAME}:latest \
        ${CI_REGISTRY_IMAGE}:build-${CI_COMMIT_SHORT_SHA}-amd64 \
        ${CI_REGISTRY_IMAGE}:build-${CI_COMMIT_SHORT_SHA}-arm64
    - echo "Successfully pushed multi-arch manifest"
    
    # 2. Cleanup (Optional: Remove the temporary architecture-specific tags from GitLab)
    # You can add a cleanup script here if you want to save space in your GitLab registry.
    
  after_script:
    - docker logout
    - docker logout "${CI_REGISTRY}"
  dependencies:
    - build_multi_arch
  only:
    - main
    - master
    - tags
  tags:
    - linuxdev-shell

# --- STAGE 3: MIRROR ---
mirror_github:
  stage: mirror
  # This step uses standard git commands. 
  # If your shell runner has git installed, you can remove the image.
  # If not, keep 'image: alpine' and switch the tag back to 'docker'.
  image: alpine:latest 
  before_script:
    - apk add --no-cache git openssh-client
    - eval $(ssh-agent -s)
    - echo "${GITHUB_SSH_PRIVATE_KEY}" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan github.com >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - git config --global user.email "${GITLAB_USER_EMAIL}"
    - git config --global user.name "${GITLAB_USER_NAME}"
  script:
    - echo "Mirroring to GitHub..."
    - git clone --mirror ${CI_REPOSITORY_URL} repo-mirror
    - cd repo-mirror
    # - git remote add github ${GITHUB_REPO_URL}
    # - git push --mirror github
  only:
    - main
    - master
    - tags
  tags:
    - docker