stages:
  - build
  - push
  - mirror

variables:
  # Common variables
  IMAGE_NAME: ${DH_ORG_NAME}/${DH_PROJECT_NAME}

# --- TEMPLATE: COMMON BUILD LOGIC ---
# This hidden job (.) contains the logic used by both architectures
.build_core: &build_core
  stage: build
  #resource_group: build_concurrency_limit
  timeout: 3h
  before_script:
    - echo "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
        
    # Create unique builder
    - docker buildx create --use --name "builder-${CI_JOB_ID}" --driver docker-container --driver-opt image=moby/buildkit:master
    - docker buildx inspect --bootstrap

  script:
    - echo "Building for ${PLATFORM} on native runner..."
    - |
      docker buildx build \
        --platform "${PLATFORM}" \
        --tag "${CI_REGISTRY_IMAGE}:build-${CI_COMMIT_SHORT_SHA}-${ARCH_TAG}" \
        --push \
        .

  after_script:
    - docker buildx rm "builder-${CI_JOB_ID}" || true
    - docker logout "${CI_REGISTRY}"
    
  only:
    - main
    - master
    - tags

# --- STAGE 1: NATIVE BUILDS ---

# Job 1: AMD64 on your existing runner
build_amd64:
  <<: *build_core
  variables:
    PLATFORM: linux/amd64
    ARCH_TAG: amd64
  tags:
    - linuxdev-shell

# Job 2: ARM64 on your new runner
build_arm64:
  <<: *build_core
  variables:
    PLATFORM: linux/arm64
    ARCH_TAG: arm64
  timeout: 3h
  tags:
    - arm64-shell  # Matches the tag you added to your new runner

# --- STAGE 2: MERGE & PUSH TO DOCKERHUB ---
push_manifest:
  stage: push
  needs:
    - job: build_amd64
    - job: build_arm64
  before_script:
    - docker info
    - echo "${DH_USER_TOKEN}" | docker login -u "${DH_USER_NAME}" --password-stdin
    - echo "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
    - docker buildx create --use --name "manifest-${CI_JOB_ID}" --driver docker-container
    - docker buildx inspect --bootstrap
  script:
    - export DATE_TAG=$(date +%Y-%m-%d)
    - echo "Merging multi-arch images into manifest..."
    - |
      docker buildx imagetools create \
        --tag ci-${IMAGE_NAME}:${DATE_TAG} \
        --tag ci-${IMAGE_NAME}:latest \
        ${CI_REGISTRY_IMAGE}:build-${CI_COMMIT_SHORT_SHA}-amd64 \
        ${CI_REGISTRY_IMAGE}:build-${CI_COMMIT_SHORT_SHA}-arm64
    - echo "Successfully pushed multi-arch manifest"
  after_script:
    - docker buildx rm "manifest-${CI_JOB_ID}" || true
    - docker logout
    - docker logout "${CI_REGISTRY}"
  only:
    - main
    - master
    - tags
  tags:
    - linuxdev-shell

# --- STAGE 3: MIRROR ---
mirror_github:
  stage: mirror
  image: alpine:latest 
  before_script:
    - apk add --no-cache git openssh-client
    - eval $(ssh-agent -s)
    - echo "${GITHUB_SSH_PRIVATE_KEY}" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan github.com >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - git config --global user.email "${GITLAB_USER_EMAIL}"
    - git config --global user.name "${GITLAB_USER_NAME}"
  script:
    - echo "Mirroring to GitHub..."
    - git clone --mirror ${CI_REPOSITORY_URL} repo-mirror
    - cd repo-mirror
    # - git remote add github ${GITHUB_REPO_URL}
    # - git push --mirror github
  only:
    - main
    - master
    - tags
  tags:
    - docker